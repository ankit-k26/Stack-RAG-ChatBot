services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stacks-qdrant
    ports:
      - '6333:6333' # REST API — matches QDRANT_URL in server/.env.example
      - '6334:6334' # gRPC (unused here, exposed in case you need it)
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
